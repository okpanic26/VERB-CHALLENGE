let currentUser=null, session=null;
function load(){return JSON.parse(localStorage.getItem('verbChallengeProfiles')||'{}')}
function save(p){localStorage.setItem('verbChallengeProfiles',JSON.stringify(p))}
function profile(name){let p=load();if(!p[name]){p[name]={name,games:0,total:0,correct:0,proCount:2,proTier:1,history:[],weak:{},schoolLevel:null};save(p)}return p[name]}
function setProfile(x){let p=load();p[x.name]=x;save(p)}
function choose(n){currentUser=profile(n);document.getElementById('topUser').textContent=n;chooseSchoolLevel()}
function setSchoolLevel(level){currentUser.schoolLevel=level;setProfile(currentUser);dashboard()}
function allItems(level){let out=[];VERBS[level].forEach(v=>v.forms.forEach(f=>out.push({inf:v.inf,conj:v.conj,conjAlt:v.conjAlt||[],trans:v.trans||['intransitivo'],voice:v.voice||['attivo'],form:f[0],mode:f[1],tense:f[2],person:f[3],num:f[4],analyses:f[5]||f[3].split("/").map(p=>[p,f[4]]),level})));if(level==='pro')out.push(...COMPOUND.map(x=>({...x,level:'pro'})));else out.push(...COMPOUND.slice(0,3).map(x=>({...x,level:'normale'})));out.push(...SPECIAL_ANALYSIS.filter(x=>x.level===level));return out}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){let pc=Math.max(0,Math.min(6,currentUser.proCount||2));let poolPro=allItems('pro'),poolNorm=allItems('normale');if(currentUser.schoolLevel!=='media'){poolPro=poolPro.filter(x=>!SPECIAL_ANALYSIS.includes(x));poolNorm=poolNorm.filter(x=>!SPECIAL_ANALYSIS.includes(x))}let seen=new Set(currentUser.recentForms||[]);function pick(pool,count){let fresh=shuffle(pool.filter(x=>!seen.has(x.inf+'|'+x.form)));let old=shuffle(pool.filter(x=>seen.has(x.inf+'|'+x.form)));return [...fresh,...old].slice(0,count)}let proQs=pick(poolPro,pc),proKeys=new Set(proQs.map(x=>x.inf+'|'+x.form));let qs=[...proQs,...pick(poolNorm.filter(x=>!proKeys.has(x.inf+'|'+x.form)),10-pc)];currentUser.recentForms=[...new Set([...(currentUser.recentForms||[]),...qs.map(x=>x.inf+'|'+x.form)])].slice(-100);setProfile(currentUser);qs=shuffle(qs).map((q,i)=>({...q,type:q.type|| (i%2?'conjugate':'analyse')}));session={i:0,score:0,correct:0,proCorrect:0,proTotal:pc,qs,answers:[]};renderQ()}
const opts=(arr)=>`<option value="">— scegli —</option>${arr.map(x=>`<option>${x}</option>`).join('')}`;
function conjOpts(){return `<option value="">— scegli —</option><option value="1ª">1ª (-are)</option><option value="2ª">2ª (-ere)</option><option value="3ª">3ª (-ire)</option><option value="propria">propria (essere/avere)</option>`;}
function advancedFields(){return currentUser && currentUser.schoolLevel==='media'}
function home(){currentUser=null;session=null;document.getElementById('topUser').textContent='';let all=load(),names=Object.keys(all).sort((a,b)=>a.localeCompare(b));document.getElementById('main').innerHTML=`<div class="center"><div class="sub">Allenamento adattivo sui verbi italiani</div><h1>Chi gioca oggi?</h1><div class="field" style="max-width:420px;margin:24px auto 0"><label for="newName">SCRIVI IL TUO NOME</label><div class="row"><input id="newName" maxlength="24" autocomplete="off" placeholder="Nome" style="flex:1;min-width:150px"><button class="btn go" type="button" id="enterBtn">ENTRA</button></div></div>${names.length?`<div class="sub" style="margin-top:26px">Profili salvati su questo dispositivo</div><div class="profiles" id="savedProfiles"></div>`:''}<div class="small" style="margin-top:18px">Ogni giocatore ha un profilo separato con difficoltà, punteggio e progressi personali, salvati solo su questo dispositivo.</div></div>`;const box=document.getElementById('savedProfiles');names.forEach(n=>{const b=document.createElement('button');b.className='profile';b.innerHTML=`<span class="av">${avatarOf({...all[n],name:n})}</span>${esc(n)}`;b.onclick=()=>choose(n);box.append(b)});const inp=document.getElementById('newName'),go=()=>{const n=inp.value.trim().slice(0,24);if(n)choose(n);else inp.focus()};document.getElementById('enterBtn').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()}}
function chooseSchoolLevel(){const p=currentUser,av=avatarOf(p);document.getElementById('main').innerHTML=`<div class="center"><div class="avatar big">${av}</div><h1>${esc(p.name)}</h1><h2>Scegli il tuo avatar</h2><div class="avatars">${AVATARS.map(a=>`<button type="button" class="avatar ${a===av?'sel':''}" onclick="pickAvatar('${a}')" aria-label="Avatar ${a}">${a}</button>`).join('')}</div><h2>Quale scuola frequenti?</h2><div class="profiles"><button class="profile ${p.schoolLevel==='elementare'?'sel':''}" onclick="setSchoolLevel('elementare')">🎒 SCUOLA ELEMENTARE</button><button class="profile ${p.schoolLevel==='media'?'sel':''}" onclick="setSchoolLevel('media')">📚 SCUOLA MEDIA</button></div><div class="small">Alle medie gli esercizi di analisi includono anche transitività e forma del verbo.</div><div class="row" style="justify-content:center;margin-top:16px"><button class="btn secondary" onclick="home()">INDIETRO</button></div></div>`}
function pickAvatar(a){currentUser.avatar=a;setProfile(currentUser);chooseSchoolLevel()}
function dashboard(){let p=currentUser,acc=p.total?Math.round(p.correct/p.total*100):0,school=p.schoolLevel==='media'?'Scuola media':'Scuola elementare',pts=p.correct*100;document.getElementById('main').innerHTML=`<div class="center"><button class="avatar big" type="button" onclick="chooseSchoolLevel()" title="Cambia avatar o scuola" aria-label="Cambia avatar o scuola">${avatarOf(p)}</button><h1>${esc(p.name)}</h1><div class="badge">${school}</div>${levelHtml(pts)}<div class="stats"><div class="stat"><b>${p.games}</b><span class="small">sfide</span></div><div class="stat"><b>${acc}%</b><span class="small">precisione</span></div><div class="stat"><b>${pts}</b><span class="small">punti totali</span></div><div class="stat"><b>${p.proCount}</b><span class="small">PRO / 10</span></div></div><button class="btn go big" onclick="start()">▶ INIZIA LA SFIDA</button><div class="tiles"><button class="tile" onclick="showRules()">📘<span>Regole dei verbi</span></button><button class="tile" onclick="exportProfile()">💾<span>Esporta profilo</span></button><button class="tile" onclick="importProfile()">📂<span>Importa profilo</span></button><button class="tile" onclick="home()">👥<span>Cambia giocatore</span></button></div></div>`}
function renderQ(){let q=session.qs[session.i],pct=session.i*10,adv=advancedFields();let display=q.form.toUpperCase();if(q.target){let t=q.target.toUpperCase(),k=display.indexOf(t);if(k>=0)display=display.slice(0,k)+'<mark>'+t+'</mark>'+display.slice(k+t.length)}
const field=(id,label,inner,wide)=>`<div class="field${wide?' wide':''}" id="f-${id}"><label>${label}</label>${inner}<div class="fieldnote"></div></div>`;
let content=q.type==='analyse'?`<div class="${q.target?'sentence':'question'}">${display}</div><div class="instruction">Analizza completamente ${q.target?'la forma verbale evidenziata nella frase':'questa forma verbale'}${adv?', compresi transitività e forma':''}.</div><div class="grid">${field('inf','INFINITO','<input id="inf" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="es. cantare">')}${field('conj','CONIUGAZIONE',chips('conj',['1ª','2ª','3ª','propria'],['1ª · -are','2ª · -ere','3ª · -ire','propria']))}${field('mode','MODO',chips('mode',['indicativo','congiuntivo','condizionale','imperativo']),true)}${field('tense','TEMPO',chips('tense',['presente','imperfetto','passato remoto','futuro semplice','passato prossimo','trapassato prossimo','trapassato remoto','passato']),true)}${field('person','PERSONA',chips('person',['1','2','3'],['1ª','2ª','3ª']))}${field('num','NUMERO',chips('num',['singolare','plurale']))}${adv?field('trans','TRANSITIVITÀ',q.inf==='essere'?'<input type="hidden" id="trans" value=""><div class="small">non applicabile</div>':chips('trans',['transitivo','intransitivo']))+field('voice','FORMA',chips('voice',['attivo','passivo','riflessivo proprio','riflessivo apparente'])):''}</div>`:`<div class="question">${q.inf.toUpperCase()}</div><div class="instruction">Scrivi la forma richiesta: <b>${q.mode} ${q.tense}</b> · ${q.person.includes('/')?'una persona valida':q.person+'ª persona'} · ${q.num}</div><div class="field" id="f-answer"><label>FORMA CONIUGATA</label><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" style="font-size:22px;text-align:center"><div class="fieldnote"></div></div>`;
document.getElementById('main').innerHTML=`<div class="row qhead"><span>Domanda <b>${session.i+1}/10</b></span>${(session.streak||0)>=2?`<span class="streak">🔥 ${session.streak} di fila</span>`:''}<span class="badge ${q.level==='pro'?'pro':''}">${q.level==='pro'?'SFIDA PRO':'NORMALE'}</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="center">${content}<div id="explain" class="hidden"></div><div class="actionbar"><div id="fb"></div><div class="row actions"><button class="btn go" id="actionBtn" type="button" data-action="confirm">CONFERMA</button><button class="btn secondary" id="rulesBtn" type="button" data-action="rules">Regole</button><button class="btn secondary" type="button" data-action="exit">Esci</button></div></div></div>`;
const first=document.getElementById(q.type==='analyse'?'inf':'answer');if(first&&matchMedia('(hover: hover)').matches)first.focus()}
function toggleExplanation(){const e=document.getElementById('explain');e.classList.toggle('hidden');if(!e.classList.contains('hidden'))e.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){let p=currentUser,before=levelOf(p.correct*100);p.games++;p.total+=10;p.correct+=session.correct;p.history.push({date:new Date().toISOString(),correct:session.correct,proCorrect:session.proCorrect,proTotal:session.proTotal});p.history=p.history.slice(-10);let recent=p.history.slice(-3);let avg=recent.reduce((s,x)=>s+x.correct,0)/(recent.length*10);if(recent.length>=3&&avg>=.85)p.proCount=Math.min(6,p.proCount+1);if(recent.length>=2&&avg<.6)p.proCount=Math.max(0,p.proCount-1);session.answers.filter(x=>!x.ok).forEach(x=>{let k=x.q.mode+' '+x.q.tense;p.weak[k]=(p.weak[k]||0)+1});setProfile(p);currentUser=p;let after=levelOf(p.correct*100),weak=Object.entries(p.weak).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]).join(', ')||'nessuna area critica';document.getElementById('main').innerHTML=`<div class="center"><div class="sub">SFIDA COMPLETATA</div>${starsHtml(session.correct)}<h1>${session.correct}/10</h1><h2>+${session.score} punti</h2>${after.i>before.i?`<div class="levelup">${after.icon} Nuovo livello: ${after.name}!</div>`:''}${levelHtml(p.correct*100)}<div class="stats"><div class="stat"><b>${session.proCorrect}/${session.proTotal}</b><span class="small">PRO corrette</span></div><div class="stat"><b>${p.proCount}</b><span class="small">PRO prossima sfida</span></div><div class="stat"><b>${Math.round(p.correct/p.total*100)}%</b><span class="small">precisione totale</span></div></div><p class="small">Da allenare: ${weak}</p><div class="row" style="justify-content:center"><button class="btn go" onclick="start()">NUOVA SFIDA</button><button class="btn secondary" onclick="dashboard()">PROFILO</button></div></div>`;if(session.correct>=8||after.i>before.i)confetti()}
function mark(id,good,msg){let el=document.getElementById('f-'+id);if(!el)return;el.classList.add(good?'good':'wrong');let n=el.querySelector('.fieldnote');if(n)n.textContent=(good?'✓ ':'✗ ')+msg}
function explanation(q){let base=`<b>${q.target||q.form}</b>: infinito <b>${q.inf}</b>, ${q.conj==='propria'?'coniugazione propria':q.conj+' coniugazione'}, <b>${q.mode} ${q.tense}</b>, ${q.person.includes('/')?q.person.split('/').map(x=>x+'ª').join('/')+' persona':q.person+'ª persona'} ${q.num}.`;let more='';if(advancedFields()){if(q.inf==='essere')more+=' Per il verbo <b>essere</b> la transitività non viene richiesta in questo esercizio.';else more+=` Il verbo è classificato qui come <b>${(q.trans||[]).join(' / ')}</b> e la forma è <b>${(q.voice||[]).join(' / ')}</b>.`;if((q.voice||[]).includes('riflessivo proprio'))more+=' Nel riflessivo proprio il pronome riflessivo coincide con il complemento oggetto: il soggetto compie l’azione su sé stesso.';if((q.voice||[]).includes('riflessivo apparente'))more+=` Nel riflessivo apparente il pronome indica a chi è rivolta l’azione, mentre il complemento oggetto è espresso${q.object?' (“'+q.object+'”)':''}.`;}return base+more}
function norm(s){return (s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function validateAnswer(){if(session.answers.length>session.i)return;let q=session.qs[session.i],ok=false,detail='',adv=advancedFields();if(q.type==='conjugate'){let a=norm(document.getElementById('answer').value),g=a===norm(q.form);ok=g;mark('answer',g,g?'corretto':'corretto: '+q.form);detail=`La risposta corretta è “${q.form}”.`}else{let vals={inf:norm(document.getElementById('inf').value),conj:document.getElementById('conj').value,mode:document.getElementById('mode').value,tense:document.getElementById('tense').value,person:document.getElementById('person').value,num:document.getElementById('num').value,trans:adv&&document.getElementById('trans')?document.getElementById('trans').value:'',voice:adv&&document.getElementById('voice')?document.getElementById('voice').value:''};let validAnalyses=(q.analyses||q.person.split('/').map(p=>[p,q.num]));let checks={inf:vals.inf===norm(q.inf),conj:vals.conj===q.conj||(q.conjAlt||[]).includes(vals.conj),mode:vals.mode===q.mode,tense:vals.tense===q.tense,pn:validAnalyses.some(([p,n])=>p===vals.person&&n===vals.num)};if(adv){checks.trans=q.inf==='essere'||(q.trans||[]).includes(vals.trans);checks.voice=(q.voice||[]).includes(vals.voice)}ok=Object.values(checks).every(Boolean);mark('inf',checks.inf,checks.inf?'corretto':'corretto: '+q.inf);mark('conj',checks.conj,checks.conj?'corretto':'corretto: '+(q.conj==='propria'?'propria':[q.conj,...(q.conjAlt||[])].join(' oppure ')));mark('mode',checks.mode,checks.mode?'corretto':'corretto: '+q.mode);mark('tense',checks.tense,checks.tense?'corretto':'corretto: '+q.tense);mark('person',checks.pn,checks.pn?'persona e numero corretti':'analisi valida: '+validAnalyses.map(([p,n])=>p+'ª '+n).join(' / '));mark('num',checks.pn,checks.pn?'persona e numero corretti':'analisi valida: '+validAnalyses.map(([p,n])=>p+'ª '+n).join(' / '));if(adv){mark('trans',checks.trans,checks.trans?'corretto':'corretto: '+(q.inf==='essere'?'non applicabile':(q.trans||[]).join(' / ')));mark('voice',checks.voice,checks.voice?'corretto':'corretto: '+(q.voice||[]).join(' / '))}detail=explanation(q)}
session.answers.push({q,ok});if(ok){session.correct++;session.score+=100;session.streak=(session.streak||0)+1;if(q.level==='pro')session.proCorrect++;confetti(16)}else session.streak=0;document.querySelectorAll('#main .chip,#main input').forEach(e=>e.disabled=true);document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'ok':'bad'}"><span>${ok?(session.streak>=3?`Corretto! 🔥 ${session.streak} di fila`:'Corretto! +100 punti'):'Quasi! Guarda le correzioni in rosso.'}</span><button class="linkbtn" type="button" onclick="toggleExplanation()">Spiegazione</button></div>`;document.getElementById('explain').innerHTML=`<div class="explain">${detail}</div>`;const ab=document.getElementById('actionBtn');ab.textContent=session.i===9?'VEDI RISULTATO':'CONTINUA →';ab.dataset.action='next';if(!ok){const w=document.querySelector('.field.wrong');if(w)w.scrollIntoView({behavior:'smooth',block:'center'})}}
function showRules(){document.getElementById('main').innerHTML=`<div class="rules"><div class="row" style="justify-content:space-between;align-items:center"><h2>Regole dei verbi</h2><button class="btn secondary" onclick="${session&&session.i<10?(session.answers.length>session.i?'next()':'renderQ()'):'dashboard()'}">INDIETRO</button></div><h3>Le tre coniugazioni</h3><p>1ª: verbi in <b>-are</b>; 2ª: verbi in <b>-ere</b>; 3ª: verbi in <b>-ire</b>. <b>Essere</b> e <b>avere</b> hanno coniugazione propria.</p><h3>Modo e tempo</h3><p>L’indicativo presenta fatti reali o certi; il congiuntivo possibilità, desideri, dubbi e valutazioni; il condizionale fatti subordinati a una condizione o espressi con cortesia; l’imperativo ordini, inviti o esortazioni. Ogni modo comprende tempi semplici e, quando previsti, tempi composti con un ausiliare.</p><h3>Persona e numero</h3><p>Le persone sono 1ª, 2ª e 3ª, al singolare e al plurale. Alcune forme sono uguali per più persone: in quel caso Verb Challenge accetta tutte le analisi grammaticalmente valide.</p><h3>Tempi composti</h3><p>Sono formati da <b>essere</b> o <b>avere</b> più il participio passato del verbo principale: per esempio <i>ho scritto</i>, <i>sono andato</i>.</p>${advancedFields()?`<h3>Transitivo e intransitivo</h3><p>Un verbo è <b>transitivo</b> quando l’azione può passare direttamente su un complemento oggetto (<i>leggo un libro</i>). È <b>intransitivo</b> quando non ammette un complemento oggetto diretto (<i>vado a scuola</i>). Alcuni verbi possono avere entrambi gli usi a seconda della frase.</p><h3>Forma attiva e passiva</h3><p>Nella forma <b>attiva</b> il soggetto compie l’azione; nella <b>passiva</b> la subisce: <i>Marco scrive la lettera</i> → <i>La lettera è scritta da Marco</i>.</p><h3>Riflessivo proprio</h3><p>Il soggetto compie l’azione su sé stesso e il pronome riflessivo svolge la funzione di complemento oggetto: <i>Mi lavo</i> = lavo me stesso.</p><h3>Riflessivo apparente</h3><p>Il pronome riflessivo non è il complemento oggetto, perché nella frase c’è già un oggetto espresso: <i>Mi lavo <b>le mani</b></i>. “Le mani” è il complemento oggetto; “mi” significa, in sostanza, <i>a me stesso</i>.</p>`:''}</div>`}
function exitChallenge(){if(!session)return;if(window.confirm('Vuoi uscire dalla sfida? Le risposte di questa partita non saranno salvate.')){session=null;dashboard()}}
function next(){session.i++;if(session.i>=10)finish();else renderQ()}
function exportProfile(){let blob=new Blob([JSON.stringify(currentUser,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='verb-challenge-'+currentUser.name.toLowerCase()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function importProfile(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let p=JSON.parse(r.result);if(!p.name)throw 0;setProfile(p);currentUser=p;document.getElementById('topUser').textContent=p.name;dashboard()}catch(e){alert('Profilo non valido.')}};r.readAsText(i.files[0])};i.click()}

// Gestione centralizzata dei pulsanti: funziona anche dopo ogni ridisegno della schermata.
document.addEventListener('click', function(ev){
  const btn=ev.target.closest('button[data-action]');
  if(!btn) return;
  ev.preventDefault();
  const action=btn.dataset.action;
  try {
    if(action==='confirm') validateAnswer();
    else if(action==='next') next();
    else if(action==='rules') showRules();
    else if(action==='exit') exitChallenge();
  } catch(err) {
    console.error(err);
    const fb=document.getElementById('fb');
    if(fb) fb.innerHTML='<div class="feedback bad">Errore tecnico: '+String(err.message||err)+'</div>';
    else alert('Errore tecnico: '+String(err.message||err));
  }
});

// Pulsanti di scelta (modo, tempo, persona...): un solo tocco seleziona la risposta.
document.addEventListener('click',function(ev){const c=ev.target.closest('button[data-chip]');if(!c||c.disabled)return;const id=c.dataset.chip;document.getElementById(id).value=c.dataset.value;document.querySelectorAll(`button[data-chip="${id}"]`).forEach(b=>b.classList.toggle('sel',b===c))});
// Invio nei campi di testo = CONFERMA / CONTINUA.
document.addEventListener('keydown',function(ev){if(ev.key!=='Enter'||!ev.target.matches('#answer,#inf'))return;ev.preventDefault();const b=document.getElementById('actionBtn');if(b)b.click()});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
home();
</script></body></html>
