<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18212b;background:#eef2f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background-color:#eef2f7;background-image:radial-gradient(circle at 20% 30%,#1723340a 0 1px,transparent 1.5px),radial-gradient(circle at 75% 65%,#17233408 0 1px,transparent 1.5px),repeating-linear-gradient(35deg,transparent 0 22px,#17233405 23px 24px,transparent 25px 46px);background-size:34px 34px,41px 41px,180px 180px}.app{width:min(760px,100%);background:white;border-radius:24px;box-shadow:0 18px 60px #1b2a3a22;overflow:hidden}.top{padding:22px 28px;background:#172334;color:white;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.08em;display:flex;align-items:center;gap:10px}.bookicon{width:30px;height:30px;flex:none}.user{opacity:.8}.main{padding:30px}.center{text-align:center}h1{font-size:36px;margin:8px 0}h2{margin:4px 0 20px}.sub{color:#687487}.profiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:28px 0}.btn,.profile{border:0;border-radius:15px;padding:16px 18px;font-size:17px;font-weight:700;cursor:pointer}.profile{background:#edf3fa;color:#172334}.profile:hover{background:#dde9f6}.btn{background:#172334;color:white}.btn.secondary{background:#e8edf3;color:#263544}.btn.pro{background:#6f42c1}.row{display:flex;gap:10px;flex-wrap:wrap}.progress{height:8px;background:#e9edf2;border-radius:9px;overflow:hidden;margin:14px 0 25px}.bar{height:100%;background:#172334}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#edf3fa;font-weight:800;font-size:12px;letter-spacing:.05em}.badge.pro{background:#efe7ff;color:#6232ad}.question{font-size:38px;font-weight:800;margin:18px 0 8px}.instruction{color:#667487;margin-bottom:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{text-align:left}.field label{display:block;font-size:13px;font-weight:700;color:#65717f;margin:0 0 5px}.field input,.field select{width:100%;padding:12px;border:1px solid #ccd4dd;border-radius:10px;font-size:16px;background:white}.field.good input,.field.good select{border:2px solid #55a96b;background:#f2fbf4}.field.wrong input,.field.wrong select{border:2px solid #cf655b;background:#fff5f4}.fieldnote{font-size:12px;margin-top:5px}.field.good .fieldnote{color:#17632d}.field.wrong .fieldnote{color:#8d251c}.rules{line-height:1.55;text-align:left}.rules h3{margin:20px 0 6px;color:#172334}.explain{background:#f4f7fa;border-radius:14px;padding:18px;margin-top:12px;text-align:left}.sentence{font-size:25px;font-weight:750;margin:18px 0 8px}.wide{grid-column:1/-1}.feedback{margin:18px 0;padding:14px;border-radius:12px;font-weight:700}.ok{background:#e4f5e9;color:#17632d}.bad{background:#fde9e7;color:#8d251c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat{background:#f2f5f8;padding:15px;border-radius:14px}.stat b{display:block;font-size:25px}.small{font-size:13px;color:#697583}.hidden{display:none}@media(max-width:600px){.main{padding:22px}.question{font-size:31px}.grid,.profiles{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:600px){body{padding:0;display:block}.app{min-height:100dvh;border-radius:0;width:100%;box-shadow:none}.top{padding:19px 16px}.main{padding:18px}.question{overflow-wrap:anywhere}.field input,.field select{min-height:45px;font-size:16px}.btn{min-height:48px}.row{align-items:center}}
</style></head><body><div class="app"><div class="top"><div class="brand"><svg class="bookicon" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 16c9-3 17-2 24 4v31c-7-5-15-6-24-3V16zm48 0c-9-3-17-2-24 4v31c7-5 15-6 24-3V16z" fill="#fffaf0" stroke="#e99a3a" stroke-width="3"/><path d="M32 20v31" stroke="#e99a3a" stroke-width="3"/></svg>VERB CHALLENGE</div><div class="user" id="topUser"></div></div><main class="main" id="main"></main></div>
<script>
const DEFAULT_NAMES=['Matteo','Filippo','Andrea'];
const VERBS={
 normale:[
  {inf:'essere',conj:'propria',trans:[],voice:['attivo'],forms:[['sono','indicativo','presente','1','singolare',[['1','singolare'],['3','plurale']]],['eravamo','indicativo','imperfetto','1','plurale'],['saranno','indicativo','futuro semplice','3','plurale'],['sarei','condizionale','presente','1','singolare'],['fossi','congiuntivo','imperfetto','1/2','singolare']]},
  {inf:'avere',conj:'propria',trans:['transitivo'],voice:['attivo'],forms:[['avevate','indicativo','imperfetto','2','plurale'],['avranno','indicativo','futuro semplice','3','plurale'],['avrei','condizionale','presente','1','singolare'],['abbiano','congiuntivo','presente','3','plurale']]},
  {inf:'giocare',conj:'1ª',trans:['transitivo','intransitivo'],voice:['attivo'],forms:[['giocavamo','indicativo','imperfetto','1','plurale'],['giocherete','indicativo','futuro semplice','2','plurale'],['giocherei','condizionale','presente','1','singolare']]},
  {inf:'scrivere',conj:'2ª',trans:['transitivo','intransitivo'],voice:['attivo'],forms:[['scrivevano','indicativo','imperfetto','3','plurale'],['scriverai','indicativo','futuro semplice','2','singolare'],['scrivereste','condizionale','presente','2','plurale']]},
  {inf:'dormire',conj:'3ª',trans:['intransitivo'],voice:['attivo'],forms:[['dormivo','indicativo','imperfetto','1','singolare'],['dormiremo','indicativo','futuro semplice','1','plurale'],['dormirebbero','condizionale','presente','3','plurale']]},
  {inf:'andare',conj:'1ª',trans:['intransitivo'],voice:['attivo'],forms:[['andammo','indicativo','passato remoto','1','plurale'],['andresti','condizionale','presente','2','singolare'],['vada','congiuntivo','presente','1/2/3','singolare']]},
  {inf:'fare',conj:'1ª',trans:['transitivo','intransitivo'],voice:['attivo'],forms:[['fecero','indicativo','passato remoto','3','plurale'],['fareste','condizionale','presente','2','plurale'],['facciamo','congiuntivo','presente','1','plurale']]},
  {inf:'venire',conj:'3ª',trans:['intransitivo'],voice:['attivo'],forms:[['vennero','indicativo','passato remoto','3','plurale'],['verrei','condizionale','presente','1','singolare'],['veniate','congiuntivo','presente','2','plurale']]}
 ],
 pro:[
  {inf:'scegliere',conj:'2ª',trans:['transitivo'],voice:['attivo'],forms:[['sceglieste','indicativo','passato remoto','2','plurale'],['sceglieremmo','condizionale','presente','1','plurale'],['scegliessero','congiuntivo','imperfetto','3','plurale']]},
  {inf:'trarre',conj:'2ª',trans:['transitivo'],voice:['attivo'],forms:[['trassero','indicativo','passato remoto','3','plurale'],['trarresti','condizionale','presente','2','singolare'],['traessimo','congiuntivo','imperfetto','1','plurale']]},
  {inf:'porre',conj:'2ª',trans:['transitivo'],voice:['attivo'],forms:[['posero','indicativo','passato remoto','3','plurale'],['porreste','condizionale','presente','2','plurale'],['ponessero','congiuntivo','imperfetto','3','plurale']]},
  {inf:'condurre',conj:'2ª',trans:['transitivo','intransitivo'],voice:['attivo'],forms:[['condussero','indicativo','passato remoto','3','plurale'],['condurremmo','condizionale','presente','1','plurale'],['conducessi','congiuntivo','imperfetto','1/2','singolare']]},
  {inf:'tacere',conj:'2ª',trans:['transitivo','intransitivo'],voice:['attivo'],forms:[['tacquero','indicativo','passato remoto','3','plurale'],['taceresti','condizionale','presente','2','singolare'],['tacessimo','congiuntivo','imperfetto','1','plurale']]}
 ]};
const COMPOUND=[
 {inf:'giocare',conj:'1ª',trans:['transitivo','intransitivo'],voice:['attivo'],form:'avevamo giocato',mode:'indicativo',tense:'trapassato prossimo',person:'1',num:'plurale'},
 {inf:'vedere',conj:'2ª',trans:['transitivo'],voice:['attivo'],form:'abbia visto',mode:'congiuntivo',tense:'passato',person:'1/2/3',num:'singolare'},
 {inf:'mangiare',conj:'1ª',trans:['transitivo','intransitivo'],voice:['attivo'],form:'avreste mangiato',mode:'condizionale',tense:'passato',person:'2',num:'plurale'},
 {inf:'finire',conj:'3ª',trans:['transitivo','intransitivo'],voice:['attivo'],form:'ebbi finito',mode:'indicativo',tense:'trapassato remoto',person:'1',num:'singolare'},
 {inf:'scegliere',conj:'2ª',trans:['transitivo'],voice:['attivo'],form:'avremmo scelto',mode:'condizionale',tense:'passato',person:'1',num:'plurale'}
];

const SPECIAL_ANALYSIS=[
 {inf:'lodare',conj:'1ª',trans:['transitivo'],voice:['passivo'],form:'sono stati lodati',mode:'indicativo',tense:'passato prossimo',person:'3',num:'plurale',analyses:[['3','plurale']],level:'normale',type:'analyse'},
 {inf:'lavarsi',conj:'1ª',trans:['transitivo'],voice:['riflessivo proprio'],form:'Mi lavo prima di uscire.',target:'mi lavo',mode:'indicativo',tense:'presente',person:'1',num:'singolare',analyses:[['1','singolare']],level:'normale',type:'analyse'},
 {inf:'pettinarsi',conj:'1ª',trans:['transitivo'],voice:['riflessivo proprio'],form:'I ragazzi si pettinano davanti allo specchio.',target:'si pettinano',mode:'indicativo',tense:'presente',person:'3',num:'plurale',analyses:[['3','plurale']],level:'normale',type:'analyse'},
 {inf:'lavarsi',conj:'1ª',trans:['transitivo'],voice:['riflessivo apparente'],form:'Mi lavo le mani prima di cena.',target:'mi lavo',object:'le mani',mode:'indicativo',tense:'presente',person:'1',num:'singolare',analyses:[['1','singolare']],level:'pro',type:'analyse'},
 {inf:'comprarsi',conj:'1ª',trans:['transitivo'],voice:['riflessivo apparente'],form:'Luca si è comprato un libro nuovo.',target:'si è comprato',object:'un libro',mode:'indicativo',tense:'passato prossimo',person:'3',num:'singolare',analyses:[['3','singolare']],level:'pro',type:'analyse'},
 {inf:'premiare',conj:'1ª',trans:['transitivo'],voice:['passivo'],form:'sarebbero stati premiati',mode:'condizionale',tense:'passato',person:'3',num:'plurale',analyses:[['3','plurale']],level:'pro',type:'analyse'}
];

let currentUser=null, session=null;
function load(){return JSON.parse(localStorage.getItem('verbChallengeProfiles')||'{}')}
function save(p){localStorage.setItem('verbChallengeProfiles',JSON.stringify(p))}
function profile(name){let p=load();if(!p[name]){p[name]={name,games:0,total:0,correct:0,proCount:2,proTier:1,history:[],weak:{}};save(p)}return p[name]}
function setProfile(x){let p=load();p[x.name]=x;save(p)}
function home(){currentUser=null;document.getElementById('topUser').textContent='';let p=load();let names=[...DEFAULT_NAMES,...Object.keys(p).filter(n=>!DEFAULT_NAMES.includes(n))];document.getElementById('main').innerHTML=`<div class="center"><div class="sub">Allenamento adattivo sui verbi italiani</div><h1>Chi gioca oggi?</h1><div class="profiles">${names.map(n=>`<button class="profile" onclick="choose('${n.replaceAll("'","\\'")}')">${n}</button>`).join('')}<button class="profile" onclick="addUser()">＋ Altro…</button></div><div class="small">Ogni giocatore ha un profilo separato con difficoltà e progressi personali.</div></div>`}
function addUser(){let n=prompt('Nome del giocatore:');if(n&&n.trim())choose(n.trim())}
function choose(n){currentUser=profile(n);document.getElementById('topUser').textContent=n;dashboard()}
function dashboard(){let p=currentUser,acc=p.total?Math.round(p.correct/p.total*100):0;document.getElementById('main').innerHTML=`<div class="center"><div class="sub">Profilo di</div><h1>${p.name}</h1><div class="stats"><div class="stat"><b>${p.games}</b><span class="small">sfide</span></div><div class="stat"><b>${acc}%</b><span class="small">precisione</span></div><div class="stat"><b>${p.proCount}</b><span class="small">PRO / 10</span></div></div><button class="btn" onclick="start()">INIZIA LA SFIDA</button><div class="row" style="justify-content:center;margin-top:12px"><button class="btn secondary" onclick="exportProfile()">Esporta profilo</button><button class="btn secondary" onclick="importProfile()">Importa profilo</button><button class="btn secondary" onclick="showRules()">Regole dei verbi</button><button class="btn secondary" onclick="home()">Cambia giocatore</button></div></div>`}
function allItems(level){let out=[];VERBS[level].forEach(v=>v.forms.forEach(f=>out.push({inf:v.inf,conj:v.conj,trans:v.trans||['intransitivo'],voice:v.voice||['attivo'],form:f[0],mode:f[1],tense:f[2],person:f[3],num:f[4],analyses:f[5]||[[f[3],f[4]]],level})));if(level==='pro')out.push(...COMPOUND.map(x=>({...x,level:'pro'})));else out.push(...COMPOUND.slice(0,3).map(x=>({...x,level:'normale'})));out.push(...SPECIAL_ANALYSIS.filter(x=>x.level===level));return out}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){let pc=Math.max(0,Math.min(6,currentUser.proCount||2));let poolPro=allItems('pro'),poolNorm=allItems('normale');if(currentUser.name!=='Matteo'){poolPro=poolPro.filter(x=>!SPECIAL_ANALYSIS.includes(x));poolNorm=poolNorm.filter(x=>!SPECIAL_ANALYSIS.includes(x))}let qs=[...shuffle(poolPro).slice(0,pc),...shuffle(poolNorm).slice(0,10-pc)];qs=shuffle(qs).map((q,i)=>({...q,type:q.type|| (i%2?'conjugate':'analyse')}));session={i:0,score:0,correct:0,proCorrect:0,proTotal:pc,qs,answers:[]};renderQ()}
const opts=(arr)=>`<option value="">— scegli —</option>${arr.map(x=>`<option>${x}</option>`).join('')}`;
function conjOpts(){return `<option value="">— scegli —</option><option value="1ª">1ª (-are)</option><option value="2ª">2ª (-ere)</option><option value="3ª">3ª (-ire)</option><option value="propria">propria (essere/avere)</option>`;}
function advancedFields(){return currentUser && currentUser.name==='Matteo'}
function renderQ(){let q=session.qs[session.i],pct=session.i*10,adv=advancedFields();let display=q.form;let content=q.type==='analyse'?`<div class="${q.target?'sentence':'question'}">${display.toUpperCase()}</div><div class="instruction">Analizza completamente ${q.target?'la forma verbale evidenziata dalla frase':'questa forma verbale'}${adv?', compresi transitività e forma':''}.</div><div class="grid"><div class="field" id="f-inf"><label>INFINITO</label><input id="inf" autocomplete="off"><div class="fieldnote"></div></div><div class="field" id="f-conj"><label>CONIUGAZIONE</label><select id="conj">${conjOpts()}</select><div class="fieldnote"></div></div><div class="field" id="f-mode"><label>MODO</label><select id="mode">${opts(['indicativo','congiuntivo','condizionale','imperativo'])}</select><div class="fieldnote"></div></div><div class="field" id="f-tense"><label>TEMPO</label><select id="tense">${opts(['presente','imperfetto','passato remoto','futuro semplice','passato prossimo','trapassato prossimo','trapassato remoto','passato'])}</select><div class="fieldnote"></div></div><div class="field" id="f-person"><label>PERSONA</label><select id="person">${opts(['1','2','3'])}</select><div class="fieldnote"></div></div><div class="field" id="f-num"><label>NUMERO</label><select id="num">${opts(['singolare','plurale'])}</select><div class="fieldnote"></div></div>${adv?`<div class="field" id="f-trans"><label>TRANSITIVITÀ</label><select id="trans" ${q.inf==='essere'?'disabled':''}>${q.inf==='essere'?'<option value="">non applicabile</option>':opts(['transitivo','intransitivo'])}</select><div class="fieldnote"></div></div><div class="field" id="f-voice"><label>FORMA</label><select id="voice">${opts(['attivo','passivo','riflessivo proprio','riflessivo apparente'])}</select><div class="fieldnote"></div></div>`:''}</div>`:`<div class="question">${q.inf.toUpperCase()}</div><div class="instruction">Scrivi la forma richiesta: <b>${q.mode} ${q.tense}</b> · ${q.person.includes('/')?'una persona valida':q.person+'ª persona'} · ${q.num}</div><div class="field" id="f-answer"><label>FORMA CONIUGATA</label><input id="answer" autocomplete="off" style="font-size:22px;text-align:center"><div class="fieldnote"></div></div>`;document.getElementById('main').innerHTML=`<div class="row" style="justify-content:space-between"><span>Domanda <b>${session.i+1}/10</b></span><span class="badge ${q.level==='pro'?'pro':''}">${q.level==='pro'?'SFIDA PRO':'NORMALE'}</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="center">${content}<div id="fb"></div><div id="explain" class="hidden"></div><div class="row" style="justify-content:center;margin-top:20px"><button class="btn" id="actionBtn" type="button" data-action="confirm">CONFERMA</button><button class="btn secondary" id="rulesBtn" type="button" data-action="rules">REGOLE</button></div></div>`;
}
function mark(id,good,msg){let el=document.getElementById('f-'+id);if(!el)return;el.classList.add(good?'good':'wrong');let n=el.querySelector('.fieldnote');if(n)n.textContent=(good?'✓ ':'✗ ')+msg}
function explanation(q){let base=`<b>${q.target||q.form}</b>: infinito <b>${q.inf}</b>, ${q.conj==='propria'?'coniugazione propria':q.conj+' coniugazione'}, <b>${q.mode} ${q.tense}</b>, ${q.person.includes('/')?q.person.split('/').map(x=>x+'ª').join('/')+' persona':q.person+'ª persona'} ${q.num}.`;let more='';if(advancedFields()){if(q.inf==='essere')more+=' Per il verbo <b>essere</b> la transitività non viene richiesta in questo esercizio.';else more+=` Il verbo è classificato qui come <b>${(q.trans||[]).join(' / ')}</b> e la forma è <b>${(q.voice||[]).join(' / ')}</b>.`;if((q.voice||[]).includes('riflessivo proprio'))more+=' Nel riflessivo proprio il pronome riflessivo coincide con il complemento oggetto: il soggetto compie l’azione su sé stesso.';if((q.voice||[]).includes('riflessivo apparente'))more+=` Nel riflessivo apparente il pronome indica a chi è rivolta l’azione, mentre il complemento oggetto è espresso${q.object?' (“'+q.object+'”)':''}.`;}return base+more}
function norm(s){return (s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function validateAnswer(){let q=session.qs[session.i],ok=false,detail='',adv=advancedFields();if(q.type==='conjugate'){let a=norm(document.getElementById('answer').value),g=a===norm(q.form);ok=g;mark('answer',g,g?'corretto':'corretto: '+q.form);detail=`La risposta corretta è “${q.form}”.`}else{let vals={inf:norm(document.getElementById('inf').value),conj:document.getElementById('conj').value,mode:document.getElementById('mode').value,tense:document.getElementById('tense').value,person:document.getElementById('person').value,num:document.getElementById('num').value,trans:adv&&document.getElementById('trans')?document.getElementById('trans').value:'',voice:adv&&document.getElementById('voice')?document.getElementById('voice').value:''};let validAnalyses=(q.analyses||q.person.split('/').map(p=>[p,q.num]));let checks={inf:vals.inf===norm(q.inf),conj:vals.conj===q.conj,mode:vals.mode===q.mode,tense:vals.tense===q.tense,pn:validAnalyses.some(([p,n])=>p===vals.person&&n===vals.num)};if(adv){checks.trans=q.inf==='essere'||(q.trans||[]).includes(vals.trans);checks.voice=(q.voice||[]).includes(vals.voice)}ok=Object.values(checks).every(Boolean);mark('inf',checks.inf,checks.inf?'corretto':'corretto: '+q.inf);mark('conj',checks.conj,checks.conj?'corretto':'corretto: '+(q.conj==='propria'?'propria':q.conj));mark('mode',checks.mode,checks.mode?'corretto':'corretto: '+q.mode);mark('tense',checks.tense,checks.tense?'corretto':'corretto: '+q.tense);mark('person',checks.pn,checks.pn?'persona e numero corretti':'analisi valida: '+validAnalyses.map(([p,n])=>p+'ª '+n).join(' / '));mark('num',checks.pn,checks.pn?'persona e numero corretti':'analisi valida: '+validAnalyses.map(([p,n])=>p+'ª '+n).join(' / '));if(adv){mark('trans',checks.trans,checks.trans?'corretto':'corretto: '+(q.inf==='essere'?'non applicabile':(q.trans||[]).join(' / ')));mark('voice',checks.voice,checks.voice?'corretto':'corretto: '+(q.voice||[]).join(' / '))}detail=explanation(q)}
session.answers.push({q,ok});if(ok){session.correct++;session.score+=100;if(q.level==='pro')session.proCorrect++;}document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'Corretto! +100 punti':'Controlla i campi evidenziati.'}</div><button class="btn secondary" onclick="toggleExplanation()">SPIEGAZIONE COMPLETA</button>`;document.getElementById('explain').innerHTML=`<div class="explain">${detail}</div>`;document.getElementById('actionBtn').textContent=session.i===9?'VEDI RISULTATO':'CONTINUA';document.getElementById('actionBtn').dataset.action='next'}
function toggleExplanation(){document.getElementById('explain').classList.toggle('hidden')}
function showRules(){document.getElementById('main').innerHTML=`<div class="rules"><div class="row" style="justify-content:space-between;align-items:center"><h2>Regole dei verbi</h2><button class="btn secondary" onclick="${session&&session.i<10?'renderQ()':'dashboard()'}">INDIETRO</button></div><h3>Le tre coniugazioni</h3><p>1ª: verbi in <b>-are</b>; 2ª: verbi in <b>-ere</b>; 3ª: verbi in <b>-ire</b>. <b>Essere</b> e <b>avere</b> hanno coniugazione propria.</p><h3>Modo e tempo</h3><p>L’indicativo presenta fatti reali o certi; il congiuntivo possibilità, desideri, dubbi e valutazioni; il condizionale fatti subordinati a una condizione o espressi con cortesia; l’imperativo ordini, inviti o esortazioni. Ogni modo comprende tempi semplici e, quando previsti, tempi composti con un ausiliare.</p><h3>Persona e numero</h3><p>Le persone sono 1ª, 2ª e 3ª, al singolare e al plurale. Alcune forme sono uguali per più persone: in quel caso Verb Challenge accetta tutte le analisi grammaticalmente valide.</p><h3>Tempi composti</h3><p>Sono formati da <b>essere</b> o <b>avere</b> più il participio passato del verbo principale: per esempio <i>ho scritto</i>, <i>sono andato</i>.</p>${advancedFields()?`<h3>Transitivo e intransitivo</h3><p>Un verbo è <b>transitivo</b> quando l’azione può passare direttamente su un complemento oggetto (<i>leggo un libro</i>). È <b>intransitivo</b> quando non ammette un complemento oggetto diretto (<i>vado a scuola</i>). Alcuni verbi possono avere entrambi gli usi a seconda della frase.</p><h3>Forma attiva e passiva</h3><p>Nella forma <b>attiva</b> il soggetto compie l’azione; nella <b>passiva</b> la subisce: <i>Marco scrive la lettera</i> → <i>La lettera è scritta da Marco</i>.</p><h3>Riflessivo proprio</h3><p>Il soggetto compie l’azione su sé stesso e il pronome riflessivo svolge la funzione di complemento oggetto: <i>Mi lavo</i> = lavo me stesso.</p><h3>Riflessivo apparente</h3><p>Il pronome riflessivo non è il complemento oggetto, perché nella frase c’è già un oggetto espresso: <i>Mi lavo <b>le mani</b></i>. “Le mani” è il complemento oggetto; “mi” significa, in sostanza, <i>a me stesso</i>.</p>`:''}</div>`}
function next(){session.i++;if(session.i>=10)finish();else renderQ()}
function finish(){let p=currentUser;p.games++;p.total+=10;p.correct+=session.correct;p.history.push({date:new Date().toISOString(),correct:session.correct,proCorrect:session.proCorrect,proTotal:session.proTotal});p.history=p.history.slice(-10);let recent=p.history.slice(-3);let avg=recent.reduce((s,x)=>s+x.correct,0)/(recent.length*10);if(recent.length>=3&&avg>=.85)p.proCount=Math.min(6,p.proCount+1);if(recent.length>=2&&avg<.6)p.proCount=Math.max(0,p.proCount-1);session.answers.filter(x=>!x.ok).forEach(x=>{let k=x.q.mode+' '+x.q.tense;p.weak[k]=(p.weak[k]||0)+1});setProfile(p);currentUser=p;let weak=Object.entries(p.weak).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]).join(', ')||'nessuna area critica';document.getElementById('main').innerHTML=`<div class="center"><div class="sub">SFIDA COMPLETATA</div><h1>${session.correct}/10</h1><h2>${session.score} punti</h2><div class="stats"><div class="stat"><b>${session.proCorrect}/${session.proTotal}</b><span class="small">PRO corrette</span></div><div class="stat"><b>${p.proCount}</b><span class="small">PRO prossima sfida</span></div><div class="stat"><b>${Math.round(p.correct/p.total*100)}%</b><span class="small">precisione totale</span></div></div><p class="small">Da allenare: ${weak}</p><div class="row" style="justify-content:center"><button class="btn" onclick="start()">NUOVA SFIDA</button><button class="btn secondary" onclick="dashboard()">PROFILO</button></div></div>`}
function exportProfile(){let blob=new Blob([JSON.stringify(currentUser,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='verb-challenge-'+currentUser.name.toLowerCase()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importProfile(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let p=JSON.parse(r.result);if(!p.name)throw 0;setProfile(p);currentUser=p;document.getElementById('topUser').textContent=p.name;dashboard()}catch(e){alert('Profilo non valido.')}};r.readAsText(i.files[0])};i.click()}

// Gestione centralizzata dei pulsanti: funziona anche dopo ogni ridisegno della schermata.
document.addEventListener('click', function(ev){
  const btn=ev.target.closest('button[data-action]');
  if(!btn) return;
  ev.preventDefault();
  const action=btn.dataset.action;
  try {
    if(action==='confirm') validateAnswer();
    else if(action==='next') next();
    else if(action==='rules') showRules();
  } catch(err) {
    console.error(err);
    const fb=document.getElementById('fb');
    if(fb) fb.innerHTML='<div class="feedback bad">Errore tecnico: '+String(err.message||err)+'</div>';
    else alert('Errore tecnico: '+String(err.message||err));
  }
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
home();
</script></body></html>
